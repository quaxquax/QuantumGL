<!DOCTYPE html>
<html>
<head>
    <title>QuantumGL Example</title>
    <style>
      canvas {
          display: block;
          margin: auto;
          border: 1px solid black;
      }
      .container {
          margin: 20px;
      }
      textarea {
          width: 100%;
          height: 150px;
          margin: 10px 0;
          font-family: monospace;
      }
      button {
          padding: 10px 20px;
          background-color: #4CAF50;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          margin: 10px 0;
      }
      button:hover {
          background-color: #45a049;
      }
      #clearButton {
          background-color: #f44336;
      }
      #clearButton:hover {
          background-color: #da190b;
      }
      #scripttag {
	  display="none"
      }
    </style>
</head>
<body>
  <canvas id="canvas" width="800" height="800"></canvas>
    <div class="container">
        <h2>WASM Text Processor</h2>
        <div>
            <label for="input">Input Text:</label>
            <textarea id="input"></textarea>
        </div>
        <button id="processButton">Process Text</button>
        <button id="clearButton">Clear Output</button>
        <div>
            <label for="output">Output (including stdout/stderr):</label>
            <textarea id="output" readonly></textarea>
        </div>
    </div>
    <script src='qugelexample.js'></script>
    <script type="text/javascript">
        // First, load the JavaScript glue code
        const moduleScript = document.createElement('script');
        moduleScript.src = 'qugel.js';
        
        moduleScript.onload = async () => {
            try {
		// Hide the script statement that emcc expects for compilation
		document.getElementById('scripttag').style.display = "none";
                // Initialize the module
                const module = await Textcopy();
                
                // Create instance of TextProcessor
                const processor = new module.TextProcessor();

		// Popluate with example quegl instructions
		document.getElementById('input').value = exampleText;
		
                // Add button click event listener
                document.getElementById('processButton').addEventListener('click', function() {
                    const input = document.getElementById('input').value;
                    const result = processor.processText(input);
                    document.getElementById('output').value += "\nProcessed Result: " + result + "\n";
                });

                // Add clear button functionality
                document.getElementById('clearButton').addEventListener('click', function() {
                    document.getElementById('output').value = '';
                });
                
                console.log('WASM module loaded successfully!');
            } catch (error) {
                console.error('Failed to load WASM module:', error);
            }
        };
        
        document.body.appendChild(moduleScript);
    </script>
    <div id="scripttag"> {{{ SCRIPT }}} </div>
</body>
</html>
